[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pd-gpnmb-snrnaseq"
version = "0.1.0"
description = "Donor-aware single-nucleus RNA-seq re-analysis of GPNMB in Parkinson's disease"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["pd_gpnmb*"]
